# Render Blueprint for Genisys Hub
# Deploys: 1 web service (Next.js + in-process cron) + 1 managed Postgres.
# See https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to the main branch on GitHub.
#   2. In Render, click "New" → "Blueprint" and select this repo.
#   3. Render detects this file, creates both services, and wires them together.
#   4. Add the remaining env vars (Google, Twilio, Anthropic, etc.) in the
#      web service's Environment tab after the first deploy.

services:
  - type: web
    name: genisys-hub
    runtime: node
    # Live service is already 1c-2g (1 CPU, 2 GB). Do not set this back to
    # starter: that plan is 512 MB and cannot hold Chromium next to the Hub.
    plan: 1c-2g
    region: oregon
    branch: main
    # NODE_ENV=production tells npm to skip devDependencies by default, but
    # Next.js + Prisma + Tailwind need their build-time tools. `--include=dev`
    # overrides that just for install, without affecting runtime behavior.
    # Do not add a Chromium step here. `npm run build` runs
    # scripts/install-render-chromium.mjs first, and only on Render when
    # the worker flag is on. This is the command the live service already uses.
    buildCommand: npm install --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=2048"
      - key: DATABASE_URL
        fromDatabase:
          name: genisys-hub-db
          property: connectionString
      - key: AUTH_URL
        sync: false # paste your Render-assigned hostname after first deploy
      - key: AUTH_SECRET
        generateValue: true # Render generates a random value on first deploy
      - key: VAULT_MASTER_KEY
        generateValue: true # IMPORTANT: back this up. If lost, vault entries are unrecoverable.
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_ALLOWED_DOMAINS
        value: leadgenisys.com,trustware.io
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        value: "+18772573649"
      - key: ANTHROPIC_API_KEY
        sync: false
      # Leave unset (off) until you are ready. Turning it on starts a new
      # deploy, and that build is the one that downloads Chromium.
      # Do not put a value here: a blueprint sync would overwrite the
      # switch you set in the dashboard.
      - key: GHL_SUBACCOUNT_WORKER_ENABLED
        sync: false

# Optional fallback, not created by this file: a Docker background worker
# from docker/ghl-subaccount-worker.Dockerfile, only if a job makes this
# service run out of its 2 GB. Give it the same DATABASE_URL and
# VAULT_MASTER_KEY, set GHL_SUBACCOUNT_CHROMIUM=system and
# GHL_SUBACCOUNT_WORKER_ENABLED=1 there, and set
# GHL_SUBACCOUNT_WORKER_RUN=0 on this web service so Chromium is not
# opened twice. That second service is extra cost. The default is not to.

databases:
  - name: genisys-hub-db
    plan: basic-256mb # $7/mo. Free tier available for dev, but sleeps after 90 days idle.
    region: oregon
    databaseName: genisys_hub
    user: genisys_hub
