<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.45 system-ui, sans-serif; margin: 0; padding: 14px; width: 340px; color: #111827; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    button { padding: 6px 10px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; font: inherit; cursor: pointer; }
    button.primary { background: #111827; color: #fff; border-color: #111827; }
    #state { color: #6b7280; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; }
    li { padding: 6px 0; border-top: 1px solid #f3f4f6; }
    li time { color: #9ca3af; font-size: 11px; display: block; }
    .ok { color: #047857; } .error { color: #b91c1c; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>Genisys — GHL sub-accounts</h1>
  <div class="row">
    <button class="primary" id="run">Check the Hub now</button>
    <span id="state"></span>
  </div>
  <ul id="log"></ul>
  <p><a href="#" id="options">Settings</a></p>
  <script src="popup.js"></script>
</body>
</html>
